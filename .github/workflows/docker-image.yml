name: Gitops-CI
on:
  push:
    branches:
      - main
env:
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout repository  
        uses: actions/checkout@v7
    
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23
    
      - name: Front-end compilation
        run: |
         cd client
         find . -name "*.js" -exec node --check {} +
      
      - name: Back-end compilation
        run: |
         cd api
         find . -name "*.js" -exec node --check {} +

  gitleaks-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Gitleaks setup
        uses: gitleaks/gitleaks-action@v3

      - name: Run Gitleaks scan
        run: |
          gitleaks detect --source ./client --exit-code 1
          gitleaks detect --source ./api --exit-code 1
  
  docker-build:
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: setup qemu
        uses: docker/setup-qemu-action@v2

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v2

      - name: frontend build and push
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:${{ env.IMAGE_TAG }}

      - name: backend build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend:${{ env.IMAGE_TAG }}
          
  gitops-cd:
    runs-on: ubuntu-latest
    needs: docker-build
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          repository: sadik167/3-Tier-GitOps-CD
          token: ${{ secrets.CD_REPO_TOKEN }}
      
      - name: Update deployment files
        run: |
          cd gitops-repo
          sed -i "s|image: sadik167/frontend:.*|image: sadik167/frontend:${{ env.IMAGE_TAG }}|g" ./deployment/frontend-deployment.yaml
          sed -i "s|image: sadik167/backend:.*|image: sadik167/backend:${{ env.IMAGE_TAG }}|g" ./deployment/backend-deployment.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update image tags"
          git push
